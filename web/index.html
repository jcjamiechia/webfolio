<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="term_summary">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>term_summary</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // Prevent browser page-zoom so pinching to zoom an embedded PDF/poster
    // doesn't scale the whole site. Trackpad pinch arrives as ctrl+wheel; the
    // event still reaches Flutter and the Drive PDF viewer keeps its own zoom
    // controls, so only the page-level zoom is suppressed.
    window.addEventListener('wheel', function (e) {
      if (e.ctrlKey) e.preventDefault();
    }, { passive: false });
    window.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) &&
          ['+', '-', '=', '0'].indexOf(e.key) !== -1) {
        e.preventDefault();
      }
    });
    document.addEventListener('gesturestart', function (e) {
      e.preventDefault();
    });
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
